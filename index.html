e,"aurora":false,"quick":true,"indoor":true,"car":true,"hike":false,"kids":true,"seasonNote":"Illugastaðir seal area closed May and June."},{"id":"heimaey","name":"Heimaey","place":"Westman Islands, off the South Coast","cat":"wildlife","detail":"The only inhabited Westman Island, where the 1973 Eldfell eruption buried part of the town and enlarged the island. The archipelago has Iceland's largest puffin colony, best seen May to September at Stórhöfði. The Herjólfur ferry sails from Landeyjahöfn, or from Þorlákshöfn (about 3 hours) in rough weather.","url":"https://www.roughguides.com/destinations/europe/iceland/southwestern-iceland/westman-islands/heimaey","lat":63.4408,"lng":-20.275,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":false,"car":true,"hike":false,"kids":true,"best":[5,6,7,8,9],"bestSet":true,"seasonNote":"Puffling rescue season ran 29 July to 29 September in 2025. Book the ferry ahead in summer."},{"id":"hrunalaug","name":"Hrunalaug","place":"Near Flúðir, South Iceland","cat":"wellness","detail":"Three small stone hot pools on private farmland, about 32 to 40°C, a five minute walk from the car park. Entry is paid (3,000 ISK adults, under 10 free) and there are changing huts but no showers. Visits are limited to 90 minutes per group.","url":"https://www.hotspringsguides.com/hot-springs/hrunalaug-hot-spring-iceland","lat":64.1332992,"lng":-20.2614987,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":true,"indoor":false,"car":true,"hike":false,"kids":true,"seasonNote":"Open year-round with seasonal hours. Honour-system payment in winter."},{"id":"krauma","name":"Krauma","place":"Reykholtsdalur, Borgarfjörður, West Iceland","cat":"wellness","detail":"Geothermal baths about 105 km from Reykjavík, fed by the Deildartunguhver hot spring mixed with cold glacial water. There are six baths, two steam baths, an infrared sauna, a cold plunge and a restaurant.","url":"https://www.icelandia.com/attractions/krauma-geothermal-baths","lat":64.66487,"lng":-21.40943,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":false,"car":true,"hike":false,"seasonNote":"Open all year; hours not listed in source."},{"id":"seljavallalaug","name":"Seljavallalaug","place":"Below Eyjafjallajökull, South Iceland","cat":"wellness","detail":"An outdoor pool built in 1923 by local volunteers, about 25 m long, fed by a hot spring. It is free, with a donation box and a basic changing shed, and no toilets or showers. Reach it on a 15 to 20 minute rocky walk up the valley.","url":"https://www.hotspringsguides.com/hot-springs/seljavallalaug-iceland","lat":63.5656,"lng":-19.6076,"trail":"Valley path from parking, 15 to 20 minutes each way","difficulty":"Easy","verify":false,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":false,"car":true,"hike":true,"kids":true,"seasonNote":"Open year-round. Water is usually 20 to 35°C and can drop below 20°C in winter."},{"id":"hotelborg","name":"Hotel Borg","place":"Reykjavik, Austurvöllur square","cat":"stay","detail":"Iceland's first luxury hotel, opened in 1930 and known for its Art Deco interiors, on Austurvöllur square near the Parliament House. Borg Spa, with hot tubs and steam baths, is included with every direct booking. Cafes and restaurants are within walking distance.","url":"https://www.keahotels.is/hotel-borg","lat":64.1473,"lng":-21.9395,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"7","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"retreatbluelagoon","name":"The Retreat at Blue Lagoon","place":"Reykjanes, Blue Lagoon near Grindavík","cat":"stay","detail":"All-suite hotel at the Blue Lagoon; stays include the Retreat Spa, the Retreat Lagoon, the Blue Lagoon and breakfast. The 2026 rate card runs from 5 January 2026 to 3 January 2027, with one-night stays only in Lava view junior suites and a two-night minimum for other suites. Bookings can be cancelled for force majeure events such as natural disasters, so check the Reykjanes eruption situation before going.","url":"https://www.bluelagoon.com/accommodation/retreat-hotel","lat":63.8812,"lng":-22.4523,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"ionhotel","name":"ION Adventure Hotel","place":"Golden Circle, Nesjavellir near Þingvallavatn","cat":"stay","detail":"A 66-room design hotel about an hour from Reykjavík, rebuilt from an inn that once housed workers at the nearby geothermal plant and opened in 2013. Guests mention a sauna, hot tub and a Northern Lights lounge with views, and the Silfra restaurant uses local produce such as Arctic char from Þingvallavatn. The about page's latest reviews date from late 2024, so confirm booking directly.","url":"https://ioniceland.is/","lat":64.11701,"lng":-21.25275,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"1","gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotelranga","name":"Hotel Rangá","place":"South Iceland, on the Rangá river near Hella","cat":"stay","detail":"Luxury four-star hotel on the banks of the Rangá river with an on-site observatory and geothermal hot tubs. Staff will ring your room if the northern lights appear during the night. Rooms start from about 431 EUR (Standard) up to 1,367 EUR (Master Suites).","url":"https://hotelranga.is/","lat":63.7864,"lng":-20.2836,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"buubble","name":"Buubble, 5 Million Star Hotel (Hrosshagi)","place":"Golden Circle, forest near Reykholt","cat":"stay","detail":"Heated, transparent 180 degree bubble domes, each in its own clearing in a private spruce forest about 10 minutes from Reykholt. From roughly September to April the aurora may be visible from bed, and a forecast is sent for the night. Toilets and showers are in a service house 30 to 50 m away, no food is sold on site, and exact directions are sent after booking.","url":"https://buubble.com/golden-circle-location/","lat":64.1650367,"lng":-20.5011813,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotelkria","name":"Hotel Kría","place":"South Coast, Vík í Mýrdal","cat":"stay","detail":"Three-star hotel built in 2018 beside the Ring Road in Vík, with Mountain View rooms facing the slope behind the village. Breakfast is included and Drangar Restaurant serves Icelandic food with a modern twist. Reception is open 24 hours.","url":"https://www.hotelkria.is/","lat":63.4181322,"lng":-18.9936025,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"2","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"blackbeachsuites","name":"Black Beach Suites","place":"South Coast, Norðurfoss near Vík","cat":"stay","detail":"Studio suites of 36 to 40 m2 with kitchenettes and views of the sea, mountains and black sand beach, close to Reynisfjara and Dyrhólaey. Studios sleep 2 to 4, which suits families or self-caterers. Reviewers call it good value; booking is through an external page.","url":"https://www.blackbeachsuites.is/","lat":63.4365,"lng":-19.0742,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"2","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"fosshotelglacierlagoon","name":"Fosshotel Glacier Lagoon","place":"Southeast, Hnappavellir in Öræfi between Skaftafell and Jökulsárlón","cat":"stay","detail":"Four-star superior hotel with 125 rooms looking over the mountains or the ocean, at the base of Hvannadalshnúkur. Low light pollution makes it a good northern lights spot, and guests get free use of hot tubs, sauna and gym. The restaurant seats up to 180 and serves Icelandic fusion food.","url":"https://www.islandshotel.is/hotels-in-iceland/fosshotel-glacier-lagoon/","lat":63.906,"lng":-16.471,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"3","gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hof1","name":"Hof 1 Hotel","place":"Southeast, Hof in Öræfasveit near Skaftafell","cat":"stay","detail":"A 47-room country hotel on a former sheep farm, right next to Hofskirkja, one of Iceland's most photographed churches. Breakfast and dinner are served on site, and Skaftafell, Jökulsárlón and Ingólfshöfði are nearby. Open all year.","url":"http://www.hof1.is","lat":63.9035,"lng":-16.704,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"3","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotelaldan","name":"Hotel Aldan","place":"East Fjords, Seyðisfjörður","cat":"stay","detail":"Hotel and restaurant in the village of Seyðisfjörður. Reception is at Aldan Restaurant with check-in 15:00 to 21:00, and breakfast is not included in the room rate. The road over the pass is generally open in winter but can close in severe weather.","url":"https://www.hotelaldan.is/","lat":65.2603,"lng":-14.0095,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"4","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"lakehotelegilsstadir","name":"Lake Hotel Egilsstaðir","place":"East Iceland, Lagarfljót lake at Egilsstaðir","cat":"stay","detail":"Family-run hotel founded in 1903 on the banks of Lagarfljót, with antique-furnished rooms in the old part and contemporary rooms in the new wing. The Baðhúsið spa has a hot tub, sauna and cold pool with lake views, and the restaurant serves a Farm Food Direct menu. Handy for Route 1 and Egilsstaðir airport.","url":"https://english.lakehotel.is/home/","lat":65.2626518,"lng":-14.415652,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"4","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotellaxa","name":"Hotel Laxá","place":"North Iceland, Olnbogaás by Lake Mývatn","cat":"stay","detail":"Modern 80-room hotel built in 2014, set in open countryside with Lake View rooms overlooking Mývatn. Guests can sign up for an Aurora Wake-Up Service. Breakfast hours differ in summer and winter.","url":"https://hotellaxa.is/en/home/","lat":65.5734189,"lng":-17.0941026,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"5","gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"fosshotelhusavik","name":"Fosshotel Húsavík","place":"North Iceland, Húsavík town centre","cat":"stay","detail":"Modern hotel in the centre of Húsavík, a short walk from the harbour where whale watching tours run year-round. The restaurant serves local produce under whale-themed decor. Free parking and Green Key certified.","url":"https://www.islandshotel.is/hotels-in-iceland/fosshotel-husavik/","lat":66.045,"lng":-17.3405,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"6","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"siglohotel","name":"Siglo Hotel","place":"North Iceland, Siglufjörður harbour","cat":"stay","detail":"Four-star hotel on the harbour of Siglufjörður with fjord views and easy access to boat tours. Guests can use the hot tub and sauna free of charge, and the superior and deluxe rooms have sea views, some with balconies.","url":"https://siglohotel.is/","lat":66.1505,"lng":-18.9075,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"deplarfarm","name":"Eleven Deplar Farm","place":"North Iceland, Fljót valley on the Troll Peninsula","cat":"stay","detail":"A 15th-century sheep farm turned into a 13-room all-inclusive adventure lodge with a geothermal indoor/outdoor pool and a large spa. Seasons cover winter (Oct to Feb, with northern lights swims), heli-skiing (late Feb to early June) and summer (June to Sept). Three-night minimum; rooms start around 4,200 USD per night with transfers from Akureyri.","url":"https://elevenexperience.com/lodge-destinations/iceland/eleven-deplar-farm","lat":65.9448,"lng":-18.9399,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hoteldjupavik","name":"Hótel Djúpavík","place":"Westfjords (Strandir), Djúpavík in Árneshreppur","cat":"stay","detail":"Eight-room hotel in a 1930s building built for women working at the herring factory, renovated and opened to guests in 1985. Rooms have washbasins and shared showers, and breakfast and dinner are served in a wooden-beamed dining room. Guided tours of the old factory are offered.","url":"https://djupavik.is/en/","lat":65.9446,"lng":-21.5596,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"heydalur","name":"Heydalur","place":"Westfjords, head of Mjóifjörður off Ísafjarðardjúp","cat":"stay","detail":"Guesthouse and restaurant at the bottom of Mjóifjörður, between Hólmavík and Ísafjörður, with a hot pool for guests. Horse riding into the valley and rowing on the calm fjord are offered. It lies 12 km from road 61.","url":"https://heydalur.is/en","lat":65.8438,"lng":-22.6784,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotelbudir","name":"Hótel Búðir","place":"Snæfellsnes, Búðir beside the Búðahraun lava field","cat":"stay","detail":"Country hotel at Búðaós on Snæfellsnes, an old trading site, with a guesthouse here since 1948 that once hosted Halldór Laxness. After a fire in 2001 a new hotel reopened fully in 2003, and its restaurant is known for a seasonal menu. About two hours plus from Reykjavík; check-in from 15:00.","url":"https://www.hotelbudir.is/","lat":64.8217,"lng":-23.3856,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"6","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"hotelhusafell","name":"Hotel Húsafell","place":"West Iceland, Húsafell near Langjökull","cat":"stay","detail":"A 48-room hotel decorated with paintings by local artist Páll Guðmundsson, close to the Langjökull glacier. The hotel says the area suits northern lights viewing, with sightings about three times a week in winter. Húsafell Giljaböð and Krauma baths are listed as nearby activities.","url":"https://www.husafell.is/gisting/hotel-husafell","lat":64.6992,"lng":-20.8714,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":true,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"fosshotelhellnar","name":"Fosshotel Hellnar","place":"Snæfellsnes, Hellnar near Arnarstapi","cat":"stay","detail":"A 39-room hotel at Hellnar with coastal views and a panorama of Snæfellsjökull glacier. The restaurant looks over the cliffs, where orcas are often seen offshore. Green Key certified, with free parking.","url":"https://www.islandshotel.is/hotels-in-iceland/fosshotel-hellnar/","lat":64.7536,"lng":-23.643,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"6","gem":false,"aurora":false,"quick":false,"indoor":true,"car":true,"hike":false},{"id":"highlandbasekerlingarfjoll","name":"Highland Base Kerlingarfjöll","place":"Central Highlands, Kerlingarfjöll off the Kjölur route","cat":"stay","detail":"Highland base at about 700 m with a hotel (new Hamar wing and refurbished heritage Aldan wing), lodges, huts and a campsite; hotel stays include breakfast and Highland Baths access, and the suite has a balcony hot tub. In summer you can drive in via Route 35 (Kjalvegur) toward F347, about 3.5 hours from Reykjavík. In winter the roads are not serviced and the only access is a pre-booked super jeep transfer.","url":"https://highlandbase.is/","lat":64.688,"lng":-19.286,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":null,"gem":false,"aurora":false,"quick":false,"indoor":true,"car":false,"hike":false},{"id":"volcanohuts","name":"Volcano Huts Þórsmörk (now Volcano Trails)","place":"Highlands, Húsadalur valley in Þórsmörk","cat":"stay","detail":"Small cottages, cabin dorms, private rooms, glamping tents and camping in the Húsadalur valley of the Þórsmörk reserve, between glaciers and volcanoes. The LavaGrill serves breakfast, lunch and dinner and there is a bar. Reach it by 4x4 or by bus, not in a regular car.","url":"https://volcanotrails.com/","lat":63.6915,"lng":-19.5421,"trail":null,"difficulty":null,"verify":true,"distance":null,"day":"2","gem":false,"aurora":false,"quick":false,"indoor":true,"car":false,"hike":false}],"chapters":[{"id":"ch1","label":"Chapter 1","title":"Reykjavík and the Golden Circle","badges":["Geysers","Waterfalls","Rift valley"],"blocks":[{"kind":"intro","title":"","html":"<p>Pick up the car at Keflavík and head for the Golden Circle, the classic loop east of Reykjavík: the rift valley at <strong>Þingvellir</strong>, the <strong>Geysir</strong> geothermal area, and <strong>Gullfoss</strong>.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Þingvellir:</strong> a rift valley on the Mid-Atlantic Ridge and the site of the Alþing, Iceland's parliament, from 930 until 1798. Parking is paid once a day for all the park's car parks. Snorkeling at <strong>Silfra</strong> is by tour only, so book it ahead.</li><li><strong>Geysir:</strong> the original Geysir rarely erupts now, but <strong>Strokkur</strong> goes off every few minutes.</li><li><strong>Gullfoss:</strong> the Hvítá drops in two stages into a crevice. Flow is strongest in summer.</li><li><strong>Evening:</strong> a soak at the <strong>Secret Lagoon</strong> in Flúðir or <strong>Laugarvatn Fontana</strong>. Both charge entry.</li></ul>"},{"kind":"more","title":"If you have more time","folded":true,"html":"<ul><li><strong>Kerið</strong>, a crater with a lake at the bottom; the rim walk takes about 20 minutes.</li><li><strong>Reykjadalur</strong>, near Hveragerði: about an hour's hike each way up a steaming valley to a warm river you can bathe in.</li><li><strong>Eimverk Distillery</strong> in Garðabær makes Flóki whisky; tours are by appointment, Monday to Friday.</li></ul>"}]},{"id":"ch2","label":"Chapter 2","title":"South Coast waterfalls and black sand","badges":["Waterfalls","Glacier","Beaches"],"blocks":[{"kind":"intro","title":"","html":"<p>East along the Ring Road under the cliffs of Eyjafjallajökull, from waterfalls to a glacier tongue to the black beaches around Vík.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Seljalandsfoss</strong> and, 600 m along the path, <strong>Gljúfrabúi</strong> hidden in its canyon. One parking fee covers both. Expect to get wet.</li><li><strong>Skógafoss</strong>, about 62 m high, at Skógar.</li><li><strong>Sólheimajökull:</strong> guided glacier walks leave from the car park; crampons and gear are provided, and the minimum age is 10.</li><li><strong>Dyrhólaey</strong> and <strong>Reynisfjara</strong> near Vík. At Reynisfjara, sneaker waves have killed visitors: stay well back from the water and follow the warning zones.</li></ul>"},{"kind":"more","title":"If you have more time","folded":true,"html":"<ul><li><strong>Kvernufoss</strong>, a short walk from the Skógar museum, and the <strong>Skógar Museum</strong> itself.</li><li><strong>Seljavallalaug</strong>, an old pool in a valley below Eyjafjallajökull.</li><li><strong>Þórsmörk</strong> is reached only by 4x4 or highland bus.</li></ul>"}]},{"id":"ch3","label":"Chapter 3","title":"Skaftafell and the glacier lagoons","badges":["Glaciers","Waterfalls","Icebergs"],"blocks":[{"kind":"intro","title":"","html":"<p>The longest drive of the first half of the trip, across the sands below Vatnajökull to Skaftafell and the glacier lagoons.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Svartifoss</strong> at Skaftafell, a 20 m waterfall framed by basalt columns, reached on foot from Skaftafell.</li><li><strong>Jökulsárlón</strong>, where icebergs drift from the glacier out to sea. Seals gather at the lagoon mouth, especially in winter.</li><li><strong>Diamond Beach</strong>, across the road, where ice washes up on the black sand.</li></ul>"},{"kind":"more","title":"If you have more time","folded":true,"html":"<ul><li><strong>Fjallsárlón</strong>, a smaller glacier lagoon just west of Jökulsárlón, with boat tours from April to October.</li><li><strong>Múlagljúfur</strong>, a canyon walk to a high waterfall; parking is paid through the Parka app.</li></ul>"}]},{"id":"ch4","label":"Chapter 4","title":"East Fjords","badges":["Fjords","Puffins","Waterfalls"],"blocks":[{"kind":"intro","title":"","html":"<p>Around the fjords to Egilsstaðir and the villages beyond it.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Hengifoss</strong>, about 128 m high in Fljótsdalur, with Litlanesfoss on the way up the trail.</li><li><strong>Seyðisfjörður</strong>, over the Fjarðarheiði pass: the rainbow street and the Blue Church.</li><li><strong>Vök Baths</strong> on Lake Urriðavatn, near Egilsstaðir, with pools floating on the lake.</li></ul>"},{"kind":"more","title":"Puffins and canyons","folded":true,"html":"<ul><li><strong>Hafnarhólmi</strong> at Borgarfjörður eystri, where about 10,000 pairs of puffins nest each summer, watched from platforms on the islet. Route 94 crosses a pass that can close with snow outside summer.</li><li><strong>Stuðlagil</strong>, a basalt column canyon in Jökuldalur.</li></ul>"}]},{"id":"ch5","label":"Chapter 5","title":"Mývatn and Dettifoss","badges":["Geothermal","Lava","Waterfalls"],"blocks":[{"kind":"intro","title":"","html":"<p>A day of lava, steam, and the biggest waterfall of the trip, around Lake Mývatn.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Dimmuborgir</strong>, a lava field of pillars and caves with marked loops from the car park.</li><li><strong>Hverir</strong>, boiling mud pools and steam vents below Námafjall. Stay on the marked paths: the ground can be scalding.</li><li><strong>Krafla</strong> and the <strong>Víti</strong> crater lake. Road 863 can be hard or impassable in winter.</li><li><strong>Dettifoss</strong>, about 100 m wide, a 1 km walk from the west car park, and on to <strong>Selfoss</strong> on the 2.5 km loop.</li><li><strong>Evening:</strong> <strong>Earth Lagoon Mývatn</strong>, the renamed and renovated nature baths.</li></ul>"},{"kind":"more","title":"The Highlands in summer","folded":true,"html":"<ul><li><strong>Askja</strong>, a caldera with Öskjuvatn and the Víti crater, is reached on F-roads with river crossings: a 4x4 or a tour, and only in summer.</li></ul>"}]},{"id":"ch6","label":"Chapter 6","title":"Húsavík, Goðafoss, and on to Snæfellsnes","badges":["Whales","Waterfalls","Long drive"],"blocks":[{"kind":"intro","title":"","html":"<p>Whale watching in the morning, then the long drive west. As written, this is a very long day: Goðafoss to Snæfellsnes is most of the way across the country. Many people split it with a night in Akureyri or Skagafjörður, or skip Snæfellsnes and return to Reykjavík by the Ring Road.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Húsavík:</strong> three-hour whale watching trips leave from the harbour. Humpback and minke whales are the most common.</li><li><strong>Goðafoss</strong>, right beside the Ring Road, with paths on both sides of the river.</li><li><strong>Snæfellsnes:</strong> <strong>Kirkjufell</strong> from below, and the coastal walk from <strong>Arnarstapi to Hellnar</strong>, about 2.5 km each way past basalt cliffs and a rock arch.</li></ul>"}]},{"id":"ch7","label":"Chapter 7","title":"Reykjanes and Reykjavík","badges":["Lagoons","Geothermal","City"],"blocks":[{"kind":"intro","title":"","html":"<p>The last day, near the airport: lava fields, steam, a lagoon, and an evening in the city.</p>"},{"kind":"route","title":"The day","html":"<ul><li><strong>Reykjanes:</strong> the <strong>Gunnuhver</strong> mud pools, the <strong>Reykjanesviti</strong> lighthouse, and the <strong>Bridge Between Continents</strong> over a rift. Check eruption news and road closures first: new cracks have formed on the peninsula.</li><li><strong>A lagoon:</strong> the <strong>Blue Lagoon</strong>, if it is open (it has closed several times during the eruptions), or the <strong>Sky Lagoon</strong> in Kópavogur, near the city.</li><li><strong>Reykjavík:</strong> <strong>Hallgrímskirkja</strong>'s tower for the view, and <strong>Perlan</strong> for its ice cave and northern lights show.</li></ul>"}]}],"links":[{"label":"Aurora forecast (Icelandic Met Office)","url":"https://en.vedur.is/weather/forecasts/aurora/"},{"label":"Safe Travel Iceland","url":"https://safetravel.is/"},{"label":"Road conditions","url":"https://umferdin.is/en"},{"label":"Weather (Icelandic Met Office)","url":"https://en.vedur.is/"},{"label":"Earthquakes and volcanoes","url":"https://en.vedur.is/earthquakes-and-volcanism/earthquakes/"}],"sample":{"name":"Wild North Ring Road","days":[{"title":"Reykjavík and the Golden Circle","chapter":"ch1","ideasDay":"1","stops":["thingvellir","geysir","gullfoss","secretlagoon"]},{"title":"South Coast waterfalls and black sand","chapter":"ch2","ideasDay":"2","stops":["seljalandsfoss","gljufrabui","skogafoss","solheimajokull","reynisfjara"]},{"title":"Skaftafell and the glacier lagoons","chapter":"ch3","ideasDay":"3","stops":["skaftafell","jokulsarlon","diamondbeach","fjallsarlon"]},{"title":"East Fjords","chapter":"ch4","ideasDay":"4","stops":["hengifoss","seydisfjordur","vokbaths","studlagil"]},{"title":"Mývatn and Dettifoss","chapter":"ch5","ideasDay":"5","stops":["dettifoss","selfoss_n","krafla","hverir","myvatn","myvatnbaths"]},{"title":"Húsavík, Goðafoss, and on to Snæfellsnes","chapter":"ch6","ideasDay":"6","stops":["husavik","godafoss","kirkjufell","arnarstapi"]},{"title":"Reykjanes and Reykjavík","chapter":"ch7","ideasDay":"7","stops":["bridgecontinents","gunnuhver","reykjanesviti","skylagoon","hallgrimskirkja"]}]},"reading":[{"title":"Driving and roads","icon":"car","html":"<p>The Ring Road (Route 1) goes all the way around the country. F-roads, the highland tracks, are only for 4x4 vehicles, often have unbridged river crossings, and usually open only in summer, from about mid June into September. Check road conditions each morning at <a href=\"https://umferdin.is/en\" target=\"_blank\" rel=\"noopener\">umferdin.is</a>.</p>"},{"title":"Safety","icon":"alert-triangle","html":"<ul><li>The emergency number is <strong>112</strong>.</li><li>Leave a travel plan and check alerts at <a href=\"https://safetravel.is/\" target=\"_blank\" rel=\"noopener\">safetravel.is</a>.</li><li>At black sand beaches like Reynisfjara, sneaker waves surge far up the beach without warning. Stay well back from the water.</li><li>In geothermal areas, stay on marked paths: the ground and water can be scalding.</li><li>Walk on glaciers only with a guide.</li><li>On Reykjanes, check eruption news and closures before you go.</li></ul>"},{"title":"Northern lights","icon":"stars","html":"<p>The aurora needs darkness and clear skies, so it is not visible in the bright summer months. Check the <a href=\"https://en.vedur.is/weather/forecasts/aurora/\" target=\"_blank\" rel=\"noopener\">aurora forecast from the Icelandic Met Office</a> for cloud cover and activity, then head away from town lights. Turn on <strong>Aurora viewing</strong> in Filters to see dark spots and stays known for it, and use <strong>Conditions now</strong> on any card for cloud cover and current aurora activity.</p>"}],"retired":{},"guide":{"lede":"Tours by theme and by region. Open one to read about it, see its places on the map, and add the ones you like to your trip.","picks":5,"tours":[{"id":"waterfalls","kind":"theme","title":"Waterfalls","intro":"From the Golden Circle and South Coast classics to canyon falls in the North and the Westfjords. Spray and wind can make paths slippery, so wear waterproofs.","icon":null,"reading":null,"stops":["dettifoss","gljufrabui","godafoss","gullfoss","hengifoss","selfoss_n","seljalandsfoss","skogafoss","skaftafell","aldeyjarfoss","dynjandi","fossalar","hjalparfoss","haifoss","kolugljufur","kvernufoss","mulagljufur","ofaerufoss"]},{"id":"hotsprings","kind":"theme","title":"Hot springs and pools","intro":"Geothermal lagoons, village pools, and wild hot pots. Most charge entry, many ask you to book ahead, and all expect you to shower before you get in.","icon":null,"reading":null,"stops":["myvatnbaths","secretlagoon","skylagoon","vokbaths","bluelagoon","djupavogskorin","geosea","grettislaug","hofsos_pool","hrunalaug","hvammsvik","krauma","krossneslaug","fontana","laugaras_lagoon","nauteyrarlaug","reykjadalur","seljavallalaug","sturlungalaug"]},{"id":"glaciers","kind":"theme","title":"Glaciers and ice","intro":"Glacier lagoons, walks on the ice with a guide, and ice tunnels. Never walk on a glacier without a guide.","icon":null,"reading":null,"stops":["diamondbeach","fjallsarlon","jokulsarlon","solheimajokull","langjokull_cave"]},{"id":"volcanoes","kind":"theme","title":"Volcanoes, lava, and canyons","intro":"Craters, lava fields, geothermal areas, canyons, and the rift valley at Þingvellir.","icon":null,"reading":null,"stops":["bridgecontinents","myvatn","geysir","gunnuhver","hverir","kirkjufell","krafla","studlagil","thingvellir","askja","eldgja","grjotagja","hekla","kerid","kerlingarfjoll","aurora_myvatn_lake","landmannalaugar","lofthellir","saxholl","seltun","silfra","vatnshellir","aurora_vik","asbyrgi"]},{"id":"coast","kind":"theme","title":"Coast and cliffs","intro":"Black sand beaches, sea stacks, basalt columns, and bird cliffs. At beaches like Reynisfjara, stay well back from the water: sneaker waves are a real danger.","icon":null,"reading":null,"stops":["arnarstapi","reykjanesviti","reynisfjara","dyrholaey","gerduberg","hvitserkur","latrabjarg","raudasandur"]},{"id":"wildlife","kind":"theme","title":"Wildlife","intro":"Whales, puffins, and seals. Puffins nest in summer, and whale watching runs from Húsavík harbour.","icon":null,"reading":null,"stops":["husavik","borgarfjordur","heimaey","hvammstangi"]},{"id":"aurora","kind":"theme","title":"Northern lights","intro":"Dark places and stays known for aurora viewing. The aurora needs darkness and clear skies, so plan for the darker months and check the forecast each evening.","icon":"stars","reading":null,"stops":["godafoss","kirkjufell","thingvellir","buubble","deplarfarm","fosshotelglacierlagoon","hotelhusafell","hotellaxa","hotelranga","ionhotel","aurora_myvatn_lake","aurora_vik"]},{"id":"hikes","kind":"theme","title":"Hikes and walks","intro":"Walks and hikes from short strolls to highland day hikes. Check the weather and conditions before you start, and register longer hikes at safetravel.is.","icon":"trekking","reading":null,"stops":["arnarstapi","myvatn","gljufrabui","hengifoss","krafla","selfoss_n","skogafoss","studlagil","skaftafell","solheimajokull","thingvellir","aldeyjarfoss","askja","eldgja","hekla","haifoss","kerlingarfjoll","kolugljufur","krossneslaug","kvernufoss","landmannalaugar","mulagljufur","reykjadalur","saxholl","seljavallalaug","silfra","vatnshellir","asbyrgi","ofaerufoss"]},{"id":"history","kind":"theme","title":"Sagas and history","intro":"Turf farms, churches, museums, and saga sites.","icon":null,"reading":null,"stops":["hallgrimskirkja","arctic_henge","bjarnarhofn","glaumbaer","grenjadarstadur","holar","witchcraft_museum","perlan","settlement_centre","skogamuseum"]},{"id":"stays","kind":"theme","title":"Places to stay","intro":"Distinctive places to stay around the country, from historic hotels to highland huts. Book ahead, especially in summer.","icon":null,"reading":null,"stops":["blackbeachsuites","buubble","deplarfarm","fosshotelglacierlagoon","fosshotelhellnar","fosshotelhusavik","heydalur","highlandbasekerlingarfjoll","hof1","hotelaldan","hotelborg","hotelhusafell","hotelkria","hotellaxa","hotelranga","hotelbudir","hoteldjupavik","ionhotel","lakehotelegilsstadir","siglohotel","retreatbluelagoon","volcanohuts"]},{"id":"reykjavik","kind":"region","title":"Reykjavík and Reykjanes","intro":"The capital, the airport peninsula, the Blue Lagoon, and the lava fields of Reykjanes. Check eruption news before visiting the Grindavík area.","icon":null,"reading":null,"stops":["bridgecontinents","gunnuhver","hallgrimskirkja","reykjanesviti","skylagoon","bluelagoon","eimverk","hotelborg","perlan","seltun","retreatbluelagoon"]},{"id":"golden","kind":"region","title":"Golden Circle","intro":"Þingvellir, Geysir, and Gullfoss, plus crater lakes and hot springs nearby.","icon":null,"reading":null,"stops":["geysir","gullfoss","secretlagoon","thingvellir","buubble","hrunalaug","langjokull_cave","ionhotel","kerid","fontana","laugaras_lagoon","reykjadalur","silfra"]},{"id":"south","kind":"region","title":"South Coast and Vík","intro":"Waterfalls under the Eyjafjallajökull cliffs, glacier walks, black sand beaches, and the village of Vík.","icon":null,"reading":null,"stops":["gljufrabui","reynisfjara","seljalandsfoss","skogafoss","solheimajokull","blackbeachsuites","dyrholaey","heimaey","hotelkria","hotelranga","kvernufoss","seljavallalaug","skogamuseum","volcanohuts","aurora_vik"]},{"id":"southeast","kind":"region","title":"Vatnajökull and the Southeast","intro":"Skaftafell, the glacier lagoons, and Diamond Beach at the foot of Vatnajökull.","icon":null,"reading":null,"stops":["diamondbeach","fjallsarlon","jokulsarlon","skaftafell","fosshotelglacierlagoon","fossalar","hof1","mulagljufur"]},{"id":"east","kind":"region","title":"East Fjords","intro":"Fjord villages, Hengifoss, Stuðlagil canyon, and puffins at Borgarfjörður eystri.","icon":null,"reading":null,"stops":["hengifoss","seydisfjordur","studlagil","vokbaths","borgarfjordur","djupavogskorin","hotelaldan","lakehotelegilsstadir"]},{"id":"north","kind":"region","title":"Mývatn and the North","intro":"Lake Mývatn's lava and geothermal sights, Dettifoss, Goðafoss, and whale watching from Húsavík.","icon":null,"reading":null,"stops":["dettifoss","myvatn","myvatnbaths","godafoss","hverir","husavik","krafla","selfoss_n","aldeyjarfoss","arctic_henge","deplarfarm","fosshotelhusavik","geosea","grenjadarstadur","grjotagja","hotellaxa","aurora_myvatn_lake","lofthellir","siglohotel","siglufjordur","asbyrgi"]},{"id":"northwest","kind":"region","title":"Skagafjörður and the Northwest","intro":"Turf farms, the Hólar cathedral, seals on the Vatnsnes peninsula, and Hvítserkur.","icon":null,"reading":null,"stops":["glaumbaer","grettislaug","hofsos_pool","hvitserkur","holar","hvammstangi","kolugljufur"]},{"id":"westfjords","kind":"region","title":"Westfjords","intro":"Remote fjords, Dynjandi, the Látrabjarg bird cliffs, and hot pots at the end of long gravel roads. Allow plenty of time.","icon":null,"reading":null,"stops":["dynjandi","heydalur","hoteldjupavik","krossneslaug","latrabjarg","witchcraft_museum","nauteyrarlaug","raudasandur"]},{"id":"west","kind":"region","title":"Snæfellsnes and the West","intro":"Kirkjufell, Snæfellsjökull National Park, basalt cliffs and craters, Borgarnes, and Krauma.","icon":null,"reading":null,"stops":["arnarstapi","kirkjufell","bjarnarhofn","fosshotelhellnar","gerduberg","hotelhusafell","hvammsvik","hotelbudir","krauma","saxholl","settlement_centre","sturlungalaug","vatnshellir"]},{"id":"highlands","kind":"region","title":"The Highlands","intro":"Landmannalaugar, Kerlingarfjöll, Askja, and Þórsmörk, reached on F-roads that usually open only in summer. You need a 4x4,   const tz = CONFIG.daylight.timeZone;
  const r = sunTimes(new Date(), pt.lat, pt.lng);
  const tm = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz });
  const body = r.polar === 'day' ? 'The sun does not set today.' : r.polar === 'night' ? 'The sun does not rise today.'
    : `Sunrise ${tm(r.rise)}, sunset ${tm(r.set)}: ${hrsMin(r.set - r.rise)} of daylight.`;
  return `<p class="daylight">${icon('sunrise')}<span><b>Today ${label ? 'at ' + esc(label) : 'in ' + esc(CONFIG.placeName)}:</b> ${body}${tz ? ` <small>Local time.</small>` : ''}</span></p>`;
}
function daylightPoint(t) {
  const s = t && [...t.days.flatMap(d => d.items), ...t.someday].map(i => S(i.stop)).find(Boolean);
  return s ? { lat: s.lat, lng: s.lng, label: s.name } : { lat: CONFIG.map.center[0], lng: CONFIG.map.center[1], label: '' };
}
function climateHtml() {
  const cl = CONFIG.climate; if (!cl) return '';
  const C = KM ? f => Math.round((f - 32) * 5 / 9) + '°' : f => f + '°';
  const P = KM ? i => Math.round(i * 25.4) + ' mm' : i => i.toFixed(1) + ' in';
  const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const rows = cl.months.map((m, i) => {
    const r = sunTimes(new Date(Date.UTC(new Date().getFullYear(), i, 15)), cl.lat, cl.lng);
    const day = r.polar === 'day' ? '24 h' : r.polar === 'night' ? '0 h' : Math.round((r.set - r.rise) / 36e5) + ' h';
    return `<tr${i === NOW_M - 1 ? ' class="now"' : ''}><th scope="row">${MN[i]}</th><td>${C(m.hi)} / ${C(m.lo)}</td><td>${P(m.precip)}</td><td>${day}</td><td class="note">${esc(m.note || '')}</td></tr>`;
  }).join('');
  return `<details class="climate"><summary>${icon('calendar-event')}When to go: weather by month</summary>
    <p class="lede" style="font-size:0.92rem">${esc(cl.intro || '')}</p>
    <div class="climate-wrap"><table class="climate-table"><thead><tr><th>Month</th><th>High / low</th><th>Rain</th><th>Daylight</th><th>What to expect</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="cond-src">${esc(cl.place)} averages${cl.source ? `, from <a href="${esc(cl.sourceUrl || '#')}" target="_blank" rel="noopener">${esc(cl.source)}</a>` : ''}. Daylight is for the middle of each month.</p></details>`;
}
function readingHtml() {
  if (!DATA.reading || !DATA.reading.length) return '';
  return DATA.reading.map(r => `<details class="more-reading"><summary>${icon(r.icon || 'book-2')}${esc(r.title)}</summary><div class="reading">${r.html}</div></details>`).join('');
}

// ---------- photos: each place's own Wikipedia article supplies its free lead photo ----------
// Only places with a "wiki" title (planners/<id>/wiki.json) get one. The photo and its credit load
// when the card opens and are remembered on this device (the image itself is kept by the service
// worker), so a card seen once still shows its photo offline. A photo is skipped when the image is
// a drawing, map, or logo, or when the article's own coordinates are far from the place.
const PHOTO_KEY = CONFIG.storagePrefix + '_photos_v1';
const PHOTO_MAX_MI = 15;
const WIKI_API = 'https://en.wikipedia.org/w/api.php';
const photoMeta = load(PHOTO_KEY, {});
const photoPending = {};
const PHOTO_REFRESH_MS = 30 * 864e5;   // look again after 30 days (an article may gain or change its photo)
const metaOf = s => { const m = photoMeta[s.id]; return m && m.title === s.wiki ? m : null; };
function photoHtml(s) {
  if (!s.wiki) return '';
  const m = metaOf(s);
  if (!m) return `<figure class="card-photo loading" data-photo="${s.id}" aria-hidden="true"></figure>`;
  if (!m.src) return '';
  return `<figure class="card-photo" data-photo="${s.id}">
    <img src="${esc(m.src)}" alt="Photo of ${esc(s.name)}" decoding="async" onerror="this.closest('figure').remove()">
    <figcaption>Photo: <a href="${esc(m.page)}" target="_blank" rel="noopener">${esc(m.credit)}</a></figcaption></figure>`;
}
const wikiUrl = q => WIKI_API + '?' + new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...q });
const plainText = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
async function fetchPhotoMeta(s) {
  const r1 = await (await fetch(wikiUrl({ action: 'query', titles: s.wiki.replace(/_/g, ' '), redirects: '1', prop: 'pageimages|coordinates',
    piprop: 'thumbnail|name', pithumbsize: '800', pilicense: 'free' }))).json();
  const pg = r1.query && r1.query.pages && r1.query.pages[0];
  if (!pg || pg.missing || !pg.thumbnail || !pg.pageimage) return { src: null };
  if (/\.svg$|logo|map|locator|seal|flag|coat[_ ]of[_ ]arms|icon|diagram/i.test(pg.pageimage)) return { src: null };
  const co = pg.coordinates && pg.coordinates[0];
  if (co && miles({ lat: co.lat, lng: co.lon }, s) > PHOTO_MAX_MI) return { src: null };
  const r2 = await (await fetch(wikiUrl({ action: 'query', titles: 'File:' + pg.pageimage, prop: 'imageinfo', iiprop: 'extmetadata',
    iiextmetadatafilter: 'Artist|LicenseShortName' }))).json();
  const fp = r2.query && r2.query.pages && r2.query.pages[0];
  const md = (fp && fp.imageinfo && fp.imageinfo[0] && fp.imageinfo[0].extmetadata) || {};
  const lic = plainText(md.LicenseShortName && md.LicenseShortName.value);
  if (!lic) return { src: null };   // no license we can show: no photo
  let artist = plainText(md.Artist && md.Artist.value);
  if (artist.length > 60) artist = artist.slice(0, 57).trim() + '...';
  return { src: pg.thumbnail.source, page: 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(pg.pageimage.replace(/ /g, '_')),
    credit: (artist ? artist + ', ' : '') + lic + ', via Wikipedia' };
}
function ensurePhoto(s) {
  if (!s || !s.wiki) return Promise.resolve(null);
  const have = metaOf(s);
  if (have && Date.now() - (have.at || 0) < PHOTO_REFRESH_MS) return Promise.resolve(have);
  if (photoPending[s.id]) return photoPending[s.id];
  photoPending[s.id] = fetchPhotoMeta(s).then(m => { photoMeta[s.id] = { ...m, title: s.wiki, at: Date.now() }; save(PHOTO_KEY, photoMeta); return photoMeta[s.id]; })
    .catch(() => null)    // offline or blocked: try again next time
    .finally(() => { delete photoPending[s.id]; });
  return photoPending[s.id];
}
function loadCardPhoto(s) {
  const fig = document.querySelector(`#card .card-photo.loading[data-photo="${s.id}"]`);
  if (!fig) { ensurePhoto(s); return; }   // already shown (or known to have none): refresh quietly when due
  ensurePhoto(s).then(() => {
    const f = document.querySelector(`#card .card-photo.loading[data-photo="${s.id}"]`);
    if (f) { if (metaOf(s)) f.outerHTML = photoHtml(s); else f.remove(); }
  });
}
function seasonHtml(s) {
  const bits = [];
  if (s.closedMonths && s.closedMonths.length === 12) bits.push('Closed for now');
  else {
    if (s.best && s.best.length < 12) bits.push(`Best ${monthSpan(s.best)}`);
    if (s.closedMonths && s.closedMonths.length) bits.push(`Usually closed ${monthSpan(s.closedMonths)}`);
  }
  if (!bits.length && !s.seasonNote) return '';
  return `<p class="season">${icon('calendar-event')}<span>${bits.length ? `<b>${esc(bits.join('. '))}.</b> ` : ''}${esc(s.seasonNote || '')}</span></p>`;
}
function reportUrl(s) {

  return `mailto:${CONFIG.reportEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

$('#card').addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-add], [data-near-add], [data-near-pick]'); if (!b) return;
  if (b.tagName === 'A') return;
  const id = ui.selected;
  if (b.dataset.add !== undefined) {
    const v = b.dataset.add; const target = v === 'new' ? 'new' : Number(v);
    const di = addToDay(id, target);
    ui.menuFor = null;
    toast(di === -1 ? 'Saved for someday' : `Added to ${dayLabel(di)}`);
    refreshAll(); return;
  }
  const act = b.dataset.act;
  if (act === 'close') closeCard();
  else if (act === 'add' || act === 'move') {
    ui.menuFor = ui.menuFor === id ? null : id; renderCard();
    const m = $('#card .add-menu'); if (m) { m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); const f = m.querySelector('[data-add]:not([disabled])'); if (f) f.focus({ preventScroll: true }); }
  }
  else if (act === 'cancel-add') { ui.menuFor = null; renderCard(); }
  else if (act === 'visit') {
    if (visitOf(id) && (visitOf(id).stars || visitOf(id).note) && !confirm('Clear your rating and notes for this place?')) return;
    if (visitOf(id)) delete store.visits[id]; else store.visits[id] = { at: Date.now(), stars: 0, note: '' };
    persist(); renderCard(); renderMap(); renderTrip(); renderMoreIfOpen();
  }
  else if (act === 'star') { const v = visitOf(id); const n = Number(b.dataset.n); v.stars = v.stars === n ? 0 : n; persist(); renderCard(); renderTrip(); renderMoreIfOpen(); }
  else if (act === 'open') openCard(b.dataset.id, { fly: true });
  else if (b.dataset.nearAdd) { addToDay(b.dataset.nearAdd, Number(b.dataset.day)); toast(`Added ${BY_ID[b.dataset.nearAdd].name} to ${dayLabel(Number(b.dataset.day))}`); refreshAll(); }
  else if (b.dataset.nearPick) { openCard(b.dataset.nearPick, { fly: true }); ui.menuFor = b.dataset.nearPick; renderCard();
    const m = $('#card .add-menu'); if (m) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (act === 'remove') { removeFromTrip(id); persist(); toast('Removed from your trip'); refreshAll(); }
  else if (act === 'cond') { loadConditions(S(id)); return; }
  else if (act === 'read') { ui.chapter = b.dataset.ch; ui.tour = null; showTab('guide'); }
  else if (act === 'tour') { ui.tour = b.dataset.tour; ui.chapter = null; showTab('guide'); $('#panel-body').scrollTop = 0; }
  else if (act === 'delplace') {
    const t = trip(); removeFromTrip(id); t.places = t.places.filter(p => p.id !== id); persist();
    closeCard(); refreshAll(); toast('Place deleted');
  }
});
$('#card').addEventListener('input', e => {

  const t = trip(); const p = t && t.places.find(x => x.id === ui.selected); if (!p) return;
  if (e.target.id === 'mine-name') p.name = e.target.value.trim() || 'New place';

// ---------- trips from files and links ----------
// Checks and copies a trip that came from outside (an import or a share link): unknown places are
// skipped, text is trimmed, and everything gets fresh ids so it can't collide with your trips.
function normalizeTrip(raw) {
  if (!raw || !Array.isArray(raw.days)) throw new Error('not a trip');
  const places = (Array.isArray(raw.places) ? raw.places : [])
    .filter(p => p && isFinite(p.lat) && isFinite(p.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180).slice(0, 200)
    .map(p => ({ old: p.id, id: 'p_' + uid(), name: String(p.name || 'My place').slice(0, 80), note: String(p.note || '').slice(0, 1000), lat: +p.lat, lng: +p.lng }));
  const remap = Object.fromEntries(places.map(p => [p.old, p.id])); places.forEach(p => delete p.old);
  let dropped = 0;
  const clean = list => (Array.isArray(list) ? list : []).map(i => i && (remap[i.stop] || (String(i.stop).startsWith('p_') ? null : liveId(i.stop))))
    .filter(x => { if (!x) dropped++; return !!x; }).map(stop => ({ id: uid(), stop }));
  const trip = { id: uid(), name: String(raw.name || 'Shared trip').slice(0, 80) || 'Shared trip', created: Date.now(),
    days: raw.days.slice(0, 60).map(d => ({ id: uid(), title: String((d && d.title) || '').slice(0, 120), note: String((d && d.note) || '').slice(0, 2000),
      chapter: d && CHAPTERS[d.chapter] ? d.chapter : undefined, ideasDay: d && d.ideasDay && CHAPTERS['ch' + d.ideasDay] ? String(d.ideasDay) : undefined,
      items: clean(d && d.items) })),
    someday: clean(raw.someday), places };
  return { trip, dropped };
}
// Share links carry the whole trip after #trip= as compact JSON in base64url, so nothing is
// uploaded anywhere: the link itself is the trip.
const b64url = {
  enc(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(s) { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
};
function encodeTrip(t) {
  const r5 = x => Math.round(x * 1e5) / 1e5;
  const ids = list => list.map(i => i.stop);
  return b64url.enc(JSON.stringify({ v: 1, n: t.name,
    d: t.days.map(d => [d.title || '', d.note || '', d.chapter || 0, d.ideasDay || 0, ids(d.items)]),
    s: ids(t.someday), p: t.places.map(p => [p.id, p.name, r5(p.lat), r5(p.lng), p.note || '']) }));
}
function decodeTrip(code) {
  const o = JSON.parse(b64url.dec(code));
  if (!o || o.v !== 1 || !Array.isArray(o.d)) throw new Error('bad link');
  const items = list => (Array.isArray(list) ? list : []).map(stop => ({ stop }));
  return { name: o.n, someday: items(o.s),
    days: o.d.map(d => ({ title: d[0], note: d[1], chapter: d[2] || undefined, ideasDay: d[3] || undefined, items: items(d[4]) })),
    places: (Array.isArray(o.p) ? o.p : []).map(p => ({ id: p[0], name: p[1], lat: p[2], lng: p[3], note: p[4] })) };
}
async function shareTrip() {

// ---------- offline: the service worker and saved maps ----------
const offline = { supported: 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'),
  status: null, busy: false, done: 0, total: 0, failed: 0 };
function swAsk(msg, onMessage) {
  return new Promise(resolve => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) { resolve(null); return; }
    const ch = new MessageChannel();
    ch.port1.onmessage = e => { if (onMessage) onMessage(e.data); if (!onMessage || /^(DONE|CLEARED|STATUS|PAGE_SAVED)$/.test(e.data.type)) resolve(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}
async function refreshOfflineStatus() {

}

      ? `<div class="btn-row"><button class="btn primary" id="off-trip"${offline.busy ? ' disabled' : ''}>${icon('download')}Save maps for ${esc(t.name)}</button>

      : `<p class="trip-meta" style="margin:8px 0">${t ? 'Add places to your trip to save maps for its route.' : 'Once your trip has places, you can save maps for its route here.'}</p>

    <div class="progress"${offline.busy || offline.total ? '' : ' hidden'}><div style="width:${offline.total ? Math.round(100 * offline.done / offline.total) : 0}%"></div></div>
    <p class="progress-label" id="off-label">${offline.busy ? `Saving map tiles: ${offline.done} of ${offline.total}` : (offline.total ? `Saved ${offline.total - offline.failed} of ${offline.total} map tiles${offline.failed ? ` (${offline.failed} couldn't be reached; try again with a better signal)` : ''}.` : '')}</p>
    ${n ? `<button class="btn small quiet danger" id="off-clear">${icon('trash')}Clear saved maps</button>` : ''}`;

// Tile addresses exactly as the map asks for them, for the base map on screen (same server letter).
function tileUrl(z, x, y) {
  const d = baseDef(); const subs = d.subdomains || 'abc';
  return d.url.replace('{s}', subs[Math.abs(x + y) % subs.length]).replace('{z}', z).replace('{x}', x).replace('{y}', y).replace('{r}', '');
}
const nativeZoom = z => Math.min(z, baseDef().maxZoom);
function tilesInBounds(bounds, z) {
  const nw = map.project(bounds.getNorthWest(), z).divideBy(256).floor();
  const se = map.project(bounds.getSouthEast(), z).divideBy(256).floor();
  const out = [];
  for (let x = nw.x; x <= se.x; x++) for (let y = nw.y; y <= se.y; y++) out.push(tileUrl(z, x, y));
  return out;
}
function tilesAround(ll, z, r) {
  const c = map.project(L.latLng(ll.lat, ll.lng), z).divideBy(256).floor();
  const out = [];
  for (let x = c.x - r; x <= c.x + r; x++) for (let y = c.y - r; y <= c.y + r; y++) out.push(tileUrl(z, x, y));
  return out;
}
const MAX_SAVE = 1000;   // matches MAX_REQUEST_TILES in sw.js
function tripTileUrls(t) {
  const pts = [...t.days.flatMap(d => d.items), ...t.someday].map(i => S(i.stop)).filter(Boolean);
  if (!pts.length) return [];
  const urls = new Set();
  const b = L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.1);
  for (let z = 9; z <= 11; z++) tilesInBounds(b, nativeZoom(z)).forEach(u => urls.add(u));      // the whole route
  pts.forEach(s => { tilesAround(s, nativeZoom(13), 1).forEach(u => urls.add(u)); tilesAround(s, nativeZoom(15), 1).forEach(u => urls.add(u)); });  // around each stop
  if (urls.size <= MAX_SAVE) return [...urls];
  return wideTripTileUrls(t, pts);
}
// A trip across a whole country (kit 1.12.0) is too big for the map-box approach above. Instead save,
// in order until the limit: each stop up close, a corridor along each day's route, an overview of
// the whole trip, then a closer look around each stop.
function wideTripTileUrls(t, pts) {
  const urls = new Set();
  const add = list => { for (const u of list) { if (urls.size >= MAX_SAVE) return false; urls.add(u); } return true; };
  const corridor = (a, b, z) => {
    const pa = map.project(L.latLng(a.lat, a.lng), z).divideBy(256), pb = map.project(L.latLng(b.lat, b.lng), z).divideBy(256);
    const n = Math.max(1, Math.ceil(pa.distanceTo(pb) * 2)), out = [];
    for (let i = 0; i <= n; i++) {
      const x = Math.floor(pa.x + (pb.x - pa.x) * i / n), y = Math.floor(pa.y + (pb.y - pa.y) * i / n);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) out.push(tileUrl(z, x + dx, y + dy));
    }
    return out;
  };
  const steps = [() => pts.flatMap(s => tilesAround(s, nativeZoom(13), 0)),
    () => t.days.flatMap(d => { const ss = d.items.map(i => S(i.stop)).filter(Boolean); return ss.slice(1).flatMap((s, i) => corridor(ss[i], s, nativeZoom(10))); }),
    () => { const b = L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.05); return [7, 8].flatMap(z => tilesInBounds(b, nativeZoom(z))); },
    () => pts.flatMap(s => tilesAround(s, nativeZoom(13), 1)),
    () => pts.flatMap(s => tilesAround(s, nativeZoom(15), 0)),
    () => pts.flatMap(s => tilesAround(s, nativeZoom(15), 1))];
  for (const step of steps) if (!add(step())) break;

}
async function saveTiles(urls, what) {
  if (!offline.supported) { toast('Saving maps needs the hosted planner.'); return; }
  if (!navigator.serviceWorker.controller) { toast('Offline mode is still getting ready. Try again in a moment.'); return; }
  if (urls.length > MAX_SAVE) { toast(`That's ${urls.length.toLocaleString()} map tiles, more than ${MAX_SAVE.toLocaleString()} at once. Zoom in, or save part of the trip.`); return; }
  offline.busy = true; offline.done = 0; offline.total = urls.length; offline.failed = 0; renderOffline();
  await swAsk({ type: 'CACHE_TILES', urls }, m => {
    if (m.type === 'PROGRESS' || m.type === 'DONE') { offline.done = m.done; offline.total = m.total; offline.failed = m.failed; }
    const bar = $('#offline-area .progress > div'), lab = $('#off-label');
    if (bar) bar.style.width = (m.total ? Math.round(100 * m.done / m.total) : 100) + '%';
    if (lab && m.type === 'PROGRESS') lab.textContent = `Saving map tiles: ${m.done} of ${m.total}`;
  });
  offline.busy = false;
  toast(offline.failed ? `Saved ${what}, except ${offline.failed} tiles that couldn't be reached` : `Saved ${what} for offline use`);
  refreshOfflineStatus();
}

      <li>iPhone: in Safari, tap Share, then Add to Home Screen.</li>
      <li>Android: in Chrome, open the menu, then Add to Home screen or Install app.</li>
      <li>It then opens full screen like an app, and works offline as above.</li></ul></div></details>
    <details><summary>${icon('alert-triangle')}Good to know</summary><div class="body"><ul>
      <li>Places marked Check hours before you go are worth a call; hours change, and some are seasonal.</li>
      ${STOPS.some(s => s.wiki) ? `<li>Photos come from each place's Wikipedia article and load when you open its card. Each one names its photographer and license; tap the credit for the original. Places without their own article have no photo.</li>` : ''}
      ${li(CONFIG.text.goodToKnow || [])}
      <li>Google Maps directions take up to ${MAX_DIRECTION_STOPS} stops, so long days get directions for the first ${MAX_DIRECTION_STOPS}.</li></ul></div></details>
  </div>`;
}
$('#btn-help').addEventListener('click', () => showTab('help'));

// ---------- tabs and the phone sheet ----------
const panel = $('#panel');
function showTab(tab) {
  if (isWide() && tab === 'map') tab = 'explore';
  ui.tab = tab;
  $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab || (tab === 'explore' && b.dataset.tab === 'map' && !isWide()))));
  if (tab === 'map') { closePanel(); return; }
  if (!isWide()) closeCard();
  $$('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));
  if (tab === 'guide') renderGuide();
  if (tab === 'help') renderHelp();
  if (tab === 'more') { renderMore(); refreshOfflineStatus(); }
  if (tab === 'trip') renderTrip();
  if (!isWide()) { panel.classList.add('open'); panel.classList.toggle('full', tab === 'guide' || tab === 'help'); }
  $('#panel-body').scrollTop = 0;
}
function closePanel() {
  if (isWide()) return;
  panel.classList.remove('open', 'full');
  $$('.tabbar [role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === 'map')));
  ui.tab = 'map';
}
$$('[role="tab"]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#btn-filters').addEventListener('click', () => showTab('explore'));
$('#btn-filters-top').addEventListener('click', () => { showTab('explore'); setTimeout(() => $('#search').focus(), 300); });
// Sheet handle: tap toggles half and full; swipe up for full, down for half or closed.
(() => {
  const h = $('#panel-handle'); let y0 = null;
  h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  h.addEventListener('touchmove', e => { if (y0 !== null) e.preventDefault(); }, { passive: false });
  h.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy > 50) { if (panel.classList.contains('full')) panel.classList.remove('full'); else closePanel(); }
    else if (dy < -50) panel.classList.add('full');
    else panel.classList.toggle('full');
  });
  h.addEventListener('click', e => { if (e.pointerType === 'mouse' || e.detail === 0) panel.classList.toggle('full'); });
})();
window.addEventListener('resize', () => { map.invalidateSize(); });

function refreshAll() {
  renderTrip(); renderResults(); renderMap();
  if (ui.selected) renderCard();
  if (ui.tour) { const y = $('#panel-body').scrollTop; renderGuide(); $('#panel-body').scrollTop = y; }
  $('#trip-label').textContent = trip() ? trip().name : '';
}

// ---------- start ----------
readShareLink();
renderExplore(); renderGuide(); renderMore(); renderTrip(); renderMap();
showTab(ui.shared ? 'trip' : (isWide() ? 'explore' : 'map'));
window.TripPlanner = { ui, CONFIG, makePlan, routeOrder, nearbyOf, planFrom, pathMi, setBaseLayer, allStopIds: () => STOPS.map(s => s.id), get store() { return store; }, openCard, addToDay, showTab, renderMap, refreshAll, encodeTrip, decodeTrip, onFix, addPlaceAt, tripTileUrls, tileUrl, offline };  // for tests
})();

</script>
